name: guardrail

# Deterministic cross-environment check (layer 1 of the Q3 guardrail).
# On the company org this job is a REQUIRED status check, so a violation blocks merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  env-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-env-isolation.py
